name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: read
  checks: read

# Only one deploy at a time; let an in-flight run finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CircleCI (build/lint/test/coverage) reports as commit statuses on the same
  # SHA, independently of this workflow. Gate the actual deploy on those
  # passing first, so a red CircleCI run never ships to Pages.
  wait-for-circleci:
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: wait-for-circleci
          wait-interval: 15
          allowed-conclusions: success

  build:
    needs: wait-for-circleci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - run: yarn build
        env:
          NODE_ENV: production

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
