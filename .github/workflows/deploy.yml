name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: read
  checks: read

# Only one deploy at a time; let an in-flight run finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CircleCI reports as commit *statuses* (the legacy Statuses API), not as
  # check runs. GitHub's UI shows both in one list, which makes them look
  # interchangeable, but the APIs are separate - and every off-the-shelf
  # "wait for checks" action reads the Checks API only. That is why this gate
  # went green for months without ever having looked at CircleCI once: it was
  # polling a list CircleCI never writes to.
  #
  # So poll the statuses directly. A required context that is missing or
  # pending keeps us waiting; failure or error stops the deploy.
  wait-for-circleci:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the CircleCI commit statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          required=(
            "ci/circleci: build"
            "ci/circleci: lint"
            "ci/circleci: test"
            "ci/circleci: site-build"
            "ci/circleci: coverage"
          )

          # site-build alone takes ~3 min, and the four jobs after it fan out
          # only once build has passed.
          deadline=$(( SECONDS + 1800 ))

          while :; do
            # The combined-status endpoint returns the most recent status per
            # context, so no de-duplication is needed here.
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status?per_page=100" \
              --jq '.statuses[] | "\(.state)\t\(.context)"' > statuses.tsv

            waiting=()
            for context in "${required[@]}"; do
              state=$(awk -F'\t' -v c="$context" '$2 == c { print $1; exit }' statuses.tsv)
              case "$state" in
                success)
                  ;;
                failure|error)
                  echo "::error::${context} reported ${state} - not deploying."
                  exit 1
                  ;;
                *)
                  waiting+=("$context")
                  ;;
              esac
            done

            if [ ${#waiting[@]} -eq 0 ]; then
              echo "All ${#required[@]} CircleCI statuses passed."
              exit 0
            fi

            if [ $SECONDS -ge $deadline ]; then
              echo "::error::Timed out after 30 min waiting for: ${waiting[*]}"
              exit 1
            fi

            echo "Waiting for: ${waiting[*]}"
            sleep 15
          done

  build:
    needs: wait-for-circleci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - run: yarn build
        env:
          NODE_ENV: production

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
